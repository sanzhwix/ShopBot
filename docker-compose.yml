# docker compose up --build
#   app    — ShopBot (API, Telegram bot, Mini App) on http://localhost:8080
#   tunnel — free Cloudflare quick tunnel that gives the Mini App the HTTPS
#            address Telegram needs. The app reads that address by itself.
services:
  app:
    build: .
    # Run as your user, so files in ./data stay yours (make reset can delete them).
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      TUNNEL_METRICS_URL: http://tunnel:2000
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:8080
    depends_on:
      - app
    restart: unless-stopped
